<svg width="360" height="48" viewBox="0 0 360 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Letras SPOLET em Montserrat Bold -->
  <text x="0" y="35" fill="#2E1C13" font-family="'Montserrat', sans-serif" font-weight="800" font-size="36" letter-spacing="7">SPOLET</text>

  <!-- O icônico "O" do Spoleto com Gema Dourada e Haste -->
  <g transform="translate(230, 22)">
    <circle cx="0" cy="0" r="14" fill="#F5A623" />
    <circle cx="0" cy="0" r="16.5" stroke="#2E1C13" stroke-width="4.5" fill="none" />
    <rect x="15" y="-2.5" width="16" height="5" rx="1.5" fill="#2E1C13" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Badge RADAR -->
  <g transform="translate(270, 7)">
    <rect x="0" y="0" width="82" height="33" rx="4" fill="#2E1C13" stroke="#F1A80A" stroke-width="1.5" />
    <text x="41" y="22" fill="#F1A80A" font-family="'Montserrat', sans-serif" font-weight="900" font-size="14" letter-spacing="3.5" text-anchor="middle">RADAR</text>
    <circle cx="72" cy="9" r="3" fill="#10B981" />
  </g>
</svg>
